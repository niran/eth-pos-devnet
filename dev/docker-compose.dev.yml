# Development override for eth-pos-devnet
# 
# This file is meant to be used alongside the main docker-compose.yml file
# to enable development with custom-built Prysm binaries. To use it, run:
#   docker compose -f docker-compose.yml -f dev/docker-compose.dev.yml up
#
# The binaries should be placed in the bin/ directory:
#   - bin/beacon-chain
#   - bin/validator

version: "3.9"
services:
  beacon-chain:
    build:
      context: .
      dockerfile: dev/Dockerfile.beacon-chain
    image: prysm-beacon-chain:dev
    volumes:
      - ./bin/beacon-chain:/usr/local/bin/beacon-chain

  validator:
    build:
      context: .
      dockerfile: dev/Dockerfile.validator
    image: prysm-validator:dev
    volumes:
      - ./bin/validator:/usr/local/bin/validator 
